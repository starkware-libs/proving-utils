[package]
name = "privacy-circuit-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Verifies a proof with a cairo-circuit verifier"

[features]
slow-tests = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
itertools.workspace = true
log.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
starknet-ff.workspace = true
starknet-types-core.workspace = true
tracing.workspace = true
zstd.workspace = true

# cairo-vm
cairo-vm = { workspace = true, features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# stwo cairo
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "b0b74007" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "b0b74007" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "b0b74007" }

# stwo circuits
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "d3bf0634" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "d3bf0634" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "d3bf0634" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "d3bf0634" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "d3bf0634" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "d3bf0634" }

# stwo
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "74951f79" }

[dev-dependencies]
ctor.workspace = true
mockall.workspace = true
rstest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
privacy-prove = { path = "../privacy_prove" }
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "74951f79", features = ["parallel"] }
