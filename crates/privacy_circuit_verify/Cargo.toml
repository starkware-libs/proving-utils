[package]
name = "privacy-circuit-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Verifies a proof with a cairo-circuit verifier"

[features]
slow-tests = []

[dependencies]
anyhow.workspace = true
itertools.workspace = true
starknet-types-core.workspace = true
tracing.workspace = true
zstd.workspace = true

# cairo-vm
cairo-vm = { workspace = true, features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# stwo cairo
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "8d32fb5" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "8d32fb5" }

# stwo circuits
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "8b63880" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "8b63880" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "8b63880" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "8b63880" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "8b63880" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "8b63880" }

# stwo
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "960b2529" }

[dev-dependencies]
ctor.workspace = true
mockall.workspace = true
rstest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
privacy-prove = { path = "../privacy_prove" }
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "960b2529", features = ["parallel"] }
