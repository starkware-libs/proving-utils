[package]
name = "stwo-privacy-circuit-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Verifies a proof with a cairo-circuit verifier"

[lib]
name = "privacy_circuit_verify"

[features]
slow-tests = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
itertools.workspace = true
log.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
starknet-ff.workspace = true
starknet-types-core.workspace = true
tracing.workspace = true
zstd.workspace = true

# local crates
cairo-program-runner-lib.workspace = true

# cairo-vm
cairo-vm = { workspace = true, features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# stwo cairo
cairo-air = { version = "1.3.0" }
stwo-cairo-serialize = { version = "1.3.0" }
stwo-cairo-common = { version = "1.3.0" }

# stwo circuits
circuit-cairo-verifier = { version = "1.0.0", package = "stwo-circuit-cairo-verifier" }
circuits-stark-verifier = { version = "1.0.0", package = "stwo-circuits-stark-verifier" }
circuits = { version = "1.0.0", package = "stwo-circuits-core" }
circuit-serialize = { version = "1.0.0", package = "stwo-circuit-serialize" }
circuit-common = { version = "1.0.0", package = "stwo-circuit-common" }
circuit-verifier = { version = "1.0.0", package = "stwo-circuit-verifier" }

# stwo
stwo = { version = "2.3.0" }

[dev-dependencies]
ctor.workspace = true
mockall.workspace = true
rstest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
privacy-prove = { path = "../privacy_prove", package = "stwo-privacy-prove" }
stwo = { version = "2.3.0", features = ["parallel"] }
