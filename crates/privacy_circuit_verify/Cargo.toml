[package]
name = "privacy-circuit-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Verifies a proof with a cairo-circuit verifier"

[features]
slow-tests = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
indexmap = "2"
itertools.workspace = true
log.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
starknet-ff.workspace = true
starknet-types-core.workspace = true
tracing.workspace = true
zstd.workspace = true

# cairo-vm
cairo-vm = { workspace = true, features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# stwo cairo (local checkout, branch gali/circuit_verification)
cairo-air = { path = "../../../stwo-cairo/stwo_cairo_prover/crates/cairo-air" }
stwo-cairo-serialize = { path = "../../../stwo-cairo/stwo_cairo_prover/crates/cairo-serialize" }
stwo-cairo-common = { path = "../../../stwo-cairo/stwo_cairo_prover/crates/common" }

# stwo circuits (local checkout, branch main)
circuit-cairo-verifier = { path = "../../../stwo-circuits/crates/cairo_verifier" }
circuits-stark-verifier = { path = "../../../stwo-circuits/crates/stark_verifier" }
circuits = { path = "../../../stwo-circuits/crates/circuits" }
circuit-serialize = { path = "../../../stwo-circuits/crates/circuit_serialize" }
circuit-common = { path = "../../../stwo-circuits/crates/circuit_common" }
circuit-verifier = { path = "../../../stwo-circuits/crates/circuit_verifier" }

# stwo
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "489a0f3e" }

[dev-dependencies]
ctor.workspace = true
mockall.workspace = true
rstest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
privacy-prove = { path = "../privacy_prove" }
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "489a0f3e", features = ["parallel"] }
