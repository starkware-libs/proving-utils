[package]
name = "privacy-circuit-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Verifies a proof with a cairo-circuit verifier"

[features]
slow-tests = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
itertools.workspace = true
log.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
starknet-ff.workspace = true
starknet-types-core.workspace = true
tracing.workspace = true
zstd.workspace = true

# cairo-vm
cairo-vm = { workspace = true, features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# stwo cairo
cairo-air = { path = "../../../stwo-cairo/stwo_cairo_prover/crates/cairo-air" }
stwo-cairo-serialize = { path = "../../../stwo-cairo/stwo_cairo_prover/crates/cairo-serialize" }
stwo-cairo-common = { path = "../../../stwo-cairo/stwo_cairo_prover/crates/common" }

# stwo circuits
circuit-cairo-air = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "79f68cf4" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "79f68cf4" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "79f68cf4" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "79f68cf4" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "79f68cf4" }
circuit-air = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "79f68cf4" }

# stwo
stwo = "2.2.0"

[dev-dependencies]
ctor.workspace = true
mockall.workspace = true
rstest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
privacy-prove = { path = "../privacy_prove", version = "1.0.0" }
