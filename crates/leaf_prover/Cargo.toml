[package]
name = "leaf_prover"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run Cairo programs, prove their runs, verify that proof with a circuit-cairo verifier and output a proof of the run of that circuit"


[dependencies]
cairo-program-runner-lib.workspace = true
cairo-vm.workspace = true
clap.workspace = true
sonic-rs.workspace = true
tracing.workspace = true
indexmap = { version = "2.10.0", default-features = false, features = ["std"] }

# Pin a specific stwo-circuits revision to keep the verifier circuit stable
circuit-cairo-verifier.workspace = true
circuits-stark-verifier.workspace = true
circuit-prover.workspace = true
circuit-common.workspace = true
circuit-serialize.workspace = true

# Use the same stwo-cairo commit as used by the above stwo-circuits
cairo-air.workspace = true
stwo-cairo-adapter.workspace = true
stwo-cairo-common.workspace = true
stwo-cairo-prover.workspace = true
stwo-cairo-utils.workspace = true