[package]
name = "privacy-prove"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Run Cairo programs and generate STWO proofs that can be verified with a cairo-circuit verifier"

[features]
slow-tests = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
itertools.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
starknet-ff.workspace = true
starknet-types-core.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true

# local crates
cairo-program-runner-lib.workspace = true
privacy-circuit-verify.workspace = true

# cairo-vm
cairo-vm = { workspace = true, features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# stwo cairo
# TODO: rev points at the pre-merge branch (starkware-libs/stwo-cairo#1787); bump to the merge commit once it lands.
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "97460b8f" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "97460b8f" }
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "97460b8f" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "97460b8f" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "97460b8f" }

# stwo circuits
# TODO: rev points at the pre-merge branch (starkware-libs/stwo-circuits#560); bump to the merge commit once it lands.
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "043c78e" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "043c78e" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "043c78e" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "043c78e" }
circuit-prover = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "043c78e" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "043c78e" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "043c78e" }

# stwo
stwo = { version = "2.2.0", features = ["parallel"] }

[dev-dependencies]
ctor.workspace = true
mockall.workspace = true
rstest.workspace = true
tracing-subscriber.workspace = true
