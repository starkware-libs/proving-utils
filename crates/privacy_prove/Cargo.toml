[package]
name = "stwo-privacy-prove"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Run Cairo programs and generate STWO proofs that can be verified with a cairo-circuit verifier"
keywords = ["cairo", "stwo", "stark", "zero-knowledge", "privacy"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "privacy_prove"

[features]
slow-tests = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
itertools.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
starknet-ff.workspace = true
starknet-types-core.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true

# local crates
cairo-program-runner-lib.workspace = true
privacy-circuit-verify.workspace = true

# cairo-vm
cairo-vm = { workspace = true, features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# stwo cairo
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "9b6be271" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "9b6be271" }
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "9b6be271" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "9b6be271" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "9b6be271" }

# stwo circuits
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5ef951a1" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5ef951a1" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5ef951a1" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5ef951a1" }
circuit-prover = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5ef951a1" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5ef951a1" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5ef951a1" }

# stwo
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "489a0f3e", features = ["parallel"] }

[dev-dependencies]
ctor.workspace = true
mockall.workspace = true
rstest.workspace = true
tracing-subscriber.workspace = true
