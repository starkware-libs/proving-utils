[package]
name = "privacy-prove"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Run Cairo programs and generate STWO proofs that can be verified with a cairo-circuit verifier"

[features]
slow-tests = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
itertools.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
starknet-ff.workspace = true
starknet-types-core.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true

# local crates
cairo-program-runner-lib.workspace = true
privacy-circuit-verify.workspace = true

# cairo-vm
cairo-vm = { workspace = true, features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# stwo cairo
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "850a7568fb4ed5aaeaf1335cfedba0706a0acca7" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "850a7568fb4ed5aaeaf1335cfedba0706a0acca7" }
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "850a7568fb4ed5aaeaf1335cfedba0706a0acca7" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "850a7568fb4ed5aaeaf1335cfedba0706a0acca7" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "850a7568fb4ed5aaeaf1335cfedba0706a0acca7" }

# stwo circuits
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "b8eff952b6feb9a250a83a0ebbf9be8891f2ff10" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "b8eff952b6feb9a250a83a0ebbf9be8891f2ff10" }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "b8eff952b6feb9a250a83a0ebbf9be8891f2ff10" }
circuit-serialize = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "b8eff952b6feb9a250a83a0ebbf9be8891f2ff10" }
circuit-prover = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "b8eff952b6feb9a250a83a0ebbf9be8891f2ff10" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "b8eff952b6feb9a250a83a0ebbf9be8891f2ff10" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "b8eff952b6feb9a250a83a0ebbf9be8891f2ff10" }

# stwo
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "bf02400c0a7b822fcd40a00dea4a5281a1346828", features = ["parallel"] }

[dev-dependencies]
ctor.workspace = true
mockall.workspace = true
rstest.workspace = true
tracing-subscriber.workspace = true
