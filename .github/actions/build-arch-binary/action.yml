name: Build and upload arch-specific binary
description: Builds a Rust binary for a specific CPU architecture and uploads it to GCS.

inputs:
  arch:
    description: CPU architecture target (e.g. znver5, sapphirerapids)
    required: true
  binary_name:
    description: Binary crate name with hyphens (e.g. stwo-run-and-prove)
    required: true

runs:
  using: composite
  steps:
    - name: Build ${{ inputs.binary_name }} for ${{ inputs.arch }}
      shell: bash
      run: |
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=${{ inputs.arch }}" \
          cargo build --release --target x86_64-unknown-linux-gnu --bin ${{ inputs.binary_name }}

    - name: Rename ${{ inputs.binary_name }} (${{ inputs.arch }})
      shell: bash
      run: |
        BINARY_NAME="${{ inputs.binary_name }}"
        BINARY_NAME="${BINARY_NAME//-/_}"
        mv "target/x86_64-unknown-linux-gnu/release/${{ inputs.binary_name }}" \
           "target/x86_64-unknown-linux-gnu/release/${BINARY_NAME}"
        echo "BINARY_NAME=${BINARY_NAME}" >> "$GITHUB_ENV"

    - name: Upload ${{ inputs.binary_name }} (${{ inputs.arch }}) to GCP
      uses: google-github-actions/upload-cloud-storage@v2
      with:
        path: "target/x86_64-unknown-linux-gnu/release/${{ env.BINARY_NAME }}"
        destination: "${{ env.BINARY_NAME }}_${{ inputs.arch }}_artifacts/${{ env.SHORT_HASH }}/release"
