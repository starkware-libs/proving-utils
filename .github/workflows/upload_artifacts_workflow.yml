name: Upload-Artifacts

on:
  push:
    branches:
      - main

jobs:
  artifacts-push:
    runs-on: namespace-profile-starkware-libs-proving-utils-medium-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Get commit hash prefix for PR update
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "SHORT_HASH=${COMMIT_SHA:0:7}" >> $GITHUB_ENV

      - name: Build all generic binaries
        run: |
          cargo build --release

      - name: Authenticate with GCS
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.SA_GPS_ARTIFACTS_BUCKET_WRITER_ACCESS_KEY }}

      - name: Upload cairo_program_runner x86_64 binary to GCP
        id: upload_cairo_program_runner_x86
        uses: "google-github-actions/upload-cloud-storage@v2"
        with:
          path: "target/release/cairo_program_runner"
          destination: "cairo_program_runner_artifacts/${{ env.SHORT_HASH }}/release"

      - name: Rename stwo-vm-runner binary
        run: mv target/release/stwo-vm-runner target/release/stwo_vm_runner

      - name: Upload stwo_vm_runner x86_64 binary to GCP
        id: upload_stwo_vm_runner_x86
        uses: "google-github-actions/upload-cloud-storage@v2"
        with:
          path: "target/release/stwo_vm_runner"
          destination: "stwo_vm_runner_artifacts/${{ env.SHORT_HASH }}/release"

      - name: Rename stwo-run-and-prove binary
        run: mv target/release/stwo-run-and-prove target/release/stwo_run_and_prove

      - name: Upload stwo_run_and_prove binary to GCP
        id: upload_stwo_run_and_prove
        uses: "google-github-actions/upload-cloud-storage@v2"
        with:
          path: "target/release/stwo_run_and_prove"
          destination: "stwo_run_and_prove_artifacts/${{ env.SHORT_HASH }}/release"

      - name: Build and upload stwo_run_and_prove for znver5
        uses: ./.github/actions/build-arch-binary
        with:
          arch: znver5
          binary_name: stwo-run-and-prove

      - name: Build and upload stwo_run_and_prove for znver4
        uses: ./.github/actions/build-arch-binary
        with:
          arch: znver4
          binary_name: stwo-run-and-prove

      - name: Build and upload stwo_run_and_prove for znver3
        uses: ./.github/actions/build-arch-binary
        with:
          arch: znver3
          binary_name: stwo-run-and-prove

      - name: Build and upload stwo_run_and_prove for emeraldrapids
        uses: ./.github/actions/build-arch-binary
        with:
          arch: emeraldrapids
          binary_name: stwo-run-and-prove

      - name: Build and upload stwo_run_and_prove for sapphirerapids
        uses: ./.github/actions/build-arch-binary
        with:
          arch: sapphirerapids
          binary_name: stwo-run-and-prove

      - name: Build and upload stwo_run_and_prove for graniterapids
        uses: ./.github/actions/build-arch-binary
        with:
          arch: graniterapids
          binary_name: stwo-run-and-prove
