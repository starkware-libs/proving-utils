name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rustfmt:
    runs-on: namespace-profile-starkware-libs-proving-utils-medium-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: nightly-2025-07-14
      - uses: Swatinem/rust-cache@v2
      - run: scripts/rust_fmt.sh --check

  clippy:
    runs-on: namespace-profile-starkware-libs-proving-utils-medium-ubuntu-24-04-amd64
    steps:
          - uses: actions/checkout@v4
          - uses: dtolnay/rust-toolchain@master
            with:
              components: clippy
              toolchain: nightly-2025-07-14
          - uses: Swatinem/rust-cache@v2
          - run: scripts/clippy.sh

  tests:
    runs-on: namespace-profile-starkware-libs-proving-utils-large-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - run: rustup show
      - run: rustup toolchain install nightly-2025-07-14 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false
      - name: "Unit tests"
        run: |
          cargo +nightly-2025-07-14 test --workspace --all-targets
      - name: "Test examples"
        run: |
          cargo +nightly-2025-07-14 run --example run_program_with_simple_bl
          cargo +nightly-2025-07-14 run --example run_pie_object_with_simple_bl
      - name: "Slow tests"
        run: cargo test --all-targets --features=slow-tests
        env:
          RUST_MIN_STACK: 4194304

  udeps:
    runs-on: namespace-profile-starkware-libs-proving-utils-medium-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup toolchain install nightly-2025-07-14 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo install cargo-udeps --locked
      - run: cargo +nightly-2025-07-14 udeps
