name: check

env:
  NIGHTLY_VERSION: "nightly-2025-07-14"
  STABLE_VERSION: "1.90.0"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rustfmt:
    runs-on: namespace-profile-starkware-libs-proving-utils-medium-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/rust_fmt.sh --check

  clippy:
    runs-on: namespace-profile-starkware-libs-proving-utils-medium-ubuntu-24-04-amd64
    steps:
          - uses: actions/checkout@v4
          - uses: dtolnay/rust-toolchain@master
            with:
              components: clippy
              toolchain: ${{ env.NIGHTLY_VERSION }}
          - uses: Swatinem/rust-cache@v2
          - run: scripts/clippy.sh

  tests:
    runs-on: namespace-profile-starkware-libs-proving-utils-large-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - run: rustup show
      - run: rustup toolchain install ${{ env.NIGHTLY_VERSION }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false
      - name: "Unit tests"
        run: |
          cargo +${{ env.NIGHTLY_VERSION }} test --workspace --all-targets
      - name: "Test examples"
        run: |
          cargo +${{ env.NIGHTLY_VERSION }} run --example run_program_with_simple_bl
          cargo +${{ env.NIGHTLY_VERSION }} run --example run_pie_object_with_simple_bl

  slow-tests:
    runs-on: namespace-profile-starkware-libs-proving-utils-large-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest
      - name: "Slow tests"
        run: |
          cargo +${{ env.NIGHTLY_VERSION }} nextest run --package privacy-prove --features=slow-tests --cargo-profile witness-opt-1  -j 1 -P ci
          cargo +${{ env.NIGHTLY_VERSION }} nextest run --package privacy-circuit-verify --features=slow-tests --cargo-profile witness-opt-1  -j 1 -P ci
        env:
          RUST_MIN_STACK: 4194304
          RUSTFLAGS: -C target-cpu=native
          RUST_LOG_SPAN_EVENTS: enter,close
          RUST_LOG: info

  verifier-stable:
    runs-on: namespace-profile-starkware-libs-proving-utils-medium-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.STABLE_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Check verifier compiles on stable
        env:
          RUSTUP_TOOLCHAIN: ${{ env.STABLE_VERSION }}
        run: cargo check --package privacy-circuit-verify

  coverage:
    runs-on: namespace-profile-starkware-libs-proving-utils-large-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: |
          cargo +${{ env.NIGHTLY_VERSION }} llvm-cov --workspace --all-targets --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  udeps:
    runs-on: namespace-profile-starkware-libs-proving-utils-medium-ubuntu-24-04-amd64
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup toolchain install ${{ env.NIGHTLY_VERSION }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo install cargo-udeps --locked
      - run: cargo +${{ env.NIGHTLY_VERSION }} udeps
