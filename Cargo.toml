[workspace]
members = [
    "crates/cairo-program-runner",
    "crates/cairo-program-runner-lib",
    "crates/stwo_run_and_prove_common",
    "crates/stwo_run_and_prove",
    "crates/stwo_run_and_prove_recursive_tree",
    "crates/vm_runner",
    "crates/privacy_prove",
    "crates/privacy_circuit_verify",
    "crates/recursive_aggregate",
]
resolver = "2"

[workspace.package]
version = "1.2.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/starkware-libs/proving-utils"

[workspace.dependencies]
anyhow = "1.0.98"
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.3.10", features = ["derive"] }
ctor = "0.2"
env_logger = "0.11.3"
itertools = { version = "0.12", default-features = false, features = [
    "use_alloc",
] }
log = "0.4.21"
num-bigint = "0.4"
num-traits = "0.2.19"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sonic-rs = "0.3.17"
starknet-crypto = "=0.8.1"
starknet-ff = "0.3.7"
starknet-types-core = "=0.2.4"
tempfile = "3.10.1"
thiserror = "1.0.61"
zstd = "0.13"
thiserror-no-std = "2.0.2"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mockall = "0.13.1"
rstest = "0.21"
expect-test = "1.4"

# cairo-vm
cairo-vm = { version = "=3.2.0", features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }

# cairo-lang
cairo-lang-executable = "2.19.0-rc.0"
cairo-lang-runner = "2.19.0-rc.0"
cairo-lang-casm = "2.19.0-rc.0"
cairo-lang-execute-utils = "2.19.0-rc.0"
cairo-lang-utils = "2.19.0-rc.0"

# stwo cairo
cairo-air = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "a837f0eaa40db776f39f2677885d7059ced867ba" }
stwo-cairo-utils = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "a837f0eaa40db776f39f2677885d7059ced867ba" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "a837f0eaa40db776f39f2677885d7059ced867ba" }
stwo-cairo-prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "a837f0eaa40db776f39f2677885d7059ced867ba" }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "a837f0eaa40db776f39f2677885d7059ced867ba" }
stwo-cairo-common = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "a837f0eaa40db776f39f2677885d7059ced867ba" }


# local crates
cairo-program-runner-lib = { path = "crates/cairo-program-runner-lib", version = "1.0.0" }
privacy-circuit-verify = { path = "crates/privacy_circuit_verify", version = "1.0.0" }
stwo-run-and-prove-common = { path = "crates/stwo_run_and_prove_common", version = "1.2.2" }


# Optimize witness generation and FFTs. This is usually enough to run the tests without stack overflows,
# while maintaining a reasonable compile time.
# In the cases where it's not enough, try to manually increase the stack size,
# See cairo-ci.yaml for an example command.
[profile.witness-opt-1]
inherits = "dev"
package = { "stwo-cairo-prover" = { opt-level = 1 }, "stwo" = { opt-level = 1 }, "circuit-prover" = { opt-level = 1 }, "privacy-prove" = { opt-level = 1 } }

[profile.samply]
inherits = "release"
debug = true

# WIP dep-graph alignment (uncommitted, laptop-only): point every stwo-circuits git dep
# (pinned at 041ec61 in the member crates) at the LOCAL stwo-circuits checkout carrying the
# uncommitted k-ary `build_multiverifier_circuit(inputs: Vec<..>)` node circuit, and redirect the
# `stwo` git source to the single vendored stwo (5ea05973-equivalent) so there is exactly ONE stwo
# in the graph. recursive_aggregate pins stwo 74951f79 but the local stwo-circuits branch pins
# 5ea05973 (#1425 "Blake2sM31MerkleChannel uses the standard MerkleHasherLifted"). We align ALL
# stwo consumers onto 5ea05973 -- the rev the stwo-circuits branch + k-ary node circuit were
# written against. (The vendored stwo-cuda-backend copy is still pre-#1425 / 74951f79-shaped, so
# it does NOT type-check against this stwo-circuits branch and would also change the proof; it is
# the GPU/box concern, out of scope for the CPU build.)
[patch."https://github.com/starkware-libs/stwo-circuits"]
circuits = { path = "../stwo-circuits/crates/circuits" }
circuit-common = { path = "../stwo-circuits/crates/circuit_common" }
circuit-prover = { path = "../stwo-circuits/crates/circuit_prover" }
circuit-verifier = { path = "../stwo-circuits/crates/circuit_verifier" }
circuit-serialize = { path = "../stwo-circuits/crates/circuit_serialize" }
circuit-multiverifier = { path = "../stwo-circuits/crates/circuit_multiverifier" }
circuits-stark-verifier = { path = "../stwo-circuits/crates/stark_verifier" }
circuit-cairo-verifier = { path = "../stwo-circuits/crates/cairo_verifier" }

